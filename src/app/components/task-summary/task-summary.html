<section class="task-summary" aria-label="Task summary">
  <div class="summary-card">
    <span class="summary-label">Total Tasks</span>
    <strong class="summary-value">{{ taskCount() }}</strong>
  </div>
  <div class="summary-card summary-card--active">
    <span class="summary-label">Active Tasks</span>
    <strong class="summary-value">{{ activeCount() }}</strong>
  </div>
  <div class="summary-card summary-card--completed">
    <span class="summary-label">Completed Tasks</span>
    <strong class="summary-value">{{ completedCount() }}</strong>
  </div>
</section>
